api: kmip_credentials_validation
feature: kmip
source: https://developer.hashicorp.com/vault/api-docs/secret/kmip
source_version: "v2.x (latest)"
notes: >
  Lookup credential requires serial_number; Revoke credential requires exactly
  one selector. Sign CSR describes a PEM CSR (not explicitly tagged required).
  Read CA explicitly errors before config has been written. This suite leaves
  config unwritten and does not generate a CA or start a listener. Consequently
  credential errors prove invalid-request rejection on a bare mount, NOT which
  field is checked first; repeat against configured signing fixtures to isolate
  validation. Missing CSR is inferred from the described signing contract.
  Mount lifecycle: https://developer.hashicorp.com/vault/api-docs/system/mounts
  (v2.x (latest)). General 400/error shape rather than KMIP-specific samples:
  https://developer.hashicorp.com/vault/api-docs#http-status-codes and #error-response
  (v2.x (latest)). Run serially with compat-kmip initially absent.
cases:
  - id: credentials-mount
    request: {method: POST, path: /v1/sys/mounts/compat-kmip, body: {type: kmip}}
    expect: {status: [200, 204, 400]}
  - id: credentials-scope
    depends: [credentials-mount]
    request: {method: POST, path: /v1/compat-kmip/scope/compat-scope, body: {}}
    expect: {status: [200, 204]}
  - id: credentials-role
    depends: [credentials-mount, credentials-scope]
    request: {method: POST, path: /v1/compat-kmip/scope/compat-scope/role/compat-role, body: {operation_get: true}}
    expect: {status: [200, 204]}
  - id: lookup-missing-serial
    depends: [credentials-mount, credentials-scope, credentials-role]
    request: {method: GET, path: /v1/compat-kmip/scope/compat-scope/role/compat-role/credential/lookup}
    expect: &invalid
      status: 400
      body_schema: {type: object, required: [errors], properties: {errors: {type: array, items: {type: string}}}}
  - id: revoke-missing-selectors
    depends: [credentials-mount, credentials-scope, credentials-role]
    request: {method: POST, path: /v1/compat-kmip/scope/compat-scope/role/compat-role/credential/revoke, body: {}}
    expect: *invalid
  - id: revoke-both-selectors
    depends: [credentials-mount, credentials-scope, credentials-role]
    request: {method: POST, path: /v1/compat-kmip/scope/compat-scope/role/compat-role/credential/revoke, body: {serial_number: '1', certificate: not-a-pem-certificate}}
    expect: *invalid
  - id: sign-missing-csr
    depends: [credentials-mount, credentials-scope, credentials-role]
    request: {method: POST, path: /v1/compat-kmip/scope/compat-scope/role/compat-role/credential/sign, body: {}}
    expect: *invalid
  - id: generate-invalid-format
    depends: [credentials-mount, credentials-scope, credentials-role]
    request: {method: POST, path: /v1/compat-kmip/scope/compat-scope/role/compat-role/credential/generate, body: {format: unsupported}}
    expect: *invalid
  - id: read-legacy-ca-before-config
    depends: [credentials-mount]
    request: {method: GET, path: /v1/compat-kmip/ca}
    expect: *invalid
  - id: credentials-role-cleanup
    depends: [credentials-mount, credentials-scope, credentials-role]
    request: {method: DELETE, path: /v1/compat-kmip/scope/compat-scope/role/compat-role}
    expect: {status: [200, 204]}
  - id: credentials-scope-cleanup
    depends: [credentials-mount, credentials-scope]
    request: {method: DELETE, path: '/v1/compat-kmip/scope/compat-scope?force=true'}
    expect: {status: [200, 204]}
  - id: credentials-unmount
    depends: [credentials-mount]
    request: {method: DELETE, path: /v1/sys/mounts/compat-kmip}
    expect: {status: [200, 204]}
