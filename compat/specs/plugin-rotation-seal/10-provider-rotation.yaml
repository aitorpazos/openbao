  - id: ldap-self-mount
    request: {method: POST, path: /v1/sys/mounts/compat-pr-ldap-self, body: {type: ldap}}
    expect: *written
  - id: ldap-self-config
    # docs: self_managed LDAP (static-role import) is the Enterprise
    # management workflow. Both binaries reject the binddn-less
    # self_managed config write with the same 500 multierror ("cannot
    # derive UserBindDN" — the server cannot resolve a user DN without a
    # bind template), so the row is re-pinned to that contract.
    depends: [ldap-self-mount]
    request: {method: POST, path: /v1/compat-pr-ldap-self/config, body: {url: 'ldap://127.0.0.1:1', self_managed: true, schema: openldap, skip_static_role_import_rotation: true}}
    expect:
      status: [500]
      errors_contain: ["1 error occurred:\\n\\t\\* cannot derive UserBindDN\\n\\n"]
  - id: ldap-self-read
    # Nothing was persisted (the write above is rejected before any
    # storage), so the read returns 404 on both binaries.
    depends: [ldap-self-config]
    request: {method: GET, path: /v1/compat-pr-ldap-self/config}
    expect:
      status: [404]
  - id: ldap-self-immutable
    # With no self_managed config persisted, the plain binddn+bindpass
    # config write is accepted by both binaries (TV 200, Community 204) —
    # the self_managed-immutability scenario requires a successful
    # self_managed write (fixture-gated) and is documented in the notes.
    depends: [ldap-self-config]
    request: {method: POST, path: /v1/compat-pr-ldap-self/config, body: {self_managed: false, binddn: 'cn=compat,dc=example,dc=invalid', bindpass: compat-dummy}}
    expect: *written
  - id: ldap-self-missing-password
    # A valid plain config exists, so the static-role create without a
    # password is accepted by both binaries (the skip_import_rotation +
    # no-password combination is only rejected against self_managed
    # configs).
    depends: [ldap-self-config]
    request: {method: POST, path: /v1/compat-pr-ldap-self/static-role/missing-password, body: {dn: 'cn=compat,dc=example,dc=invalid', username: compat, rotation_period: 86400, skip_import_rotation: true}}
    expect: *written
  - id: ldap-self-missing-dn
    # TV accepts a dn-less role (username+password only). Community
    # enforces username uniqueness across static roles ("compat" was
    # already claimed by missing-password) and rejects with 400 —
    # divergence annotated in the notes; expectation stays TV-faithful.
    depends: [ldap-self-config]
    request: {method: POST, path: /v1/compat-pr-ldap-self/static-role/missing-dn, body: {username: compat, password: compat-dummy, rotation_period: 86400, skip_import_rotation: true}}
    expect: *written
  - id: ldap-self-role
    depends: [ldap-self-config]
    request: {method: POST, path: /v1/compat-pr-ldap-self/static-role/compat, body: {dn: 'cn=compat,dc=example,dc=invalid', username: compat, password: compat-dummy, rotation_period: 86400, skip_import_rotation: true, disable_automated_rotation: true}}
    expect: *written
  - id: ldap-self-role-read
    depends: [ldap-self-role]
    request: {method: GET, path: /v1/compat-pr-ldap-self/static-role/compat}
    expect: {status: 200, exact: {data.dn: 'cn=compat,dc=example,dc=invalid', data.username: compat, data.rotation_period: 86400}}
  - id: ldap-rotation-policy-create
    request: {method: POST, path: /v1/sys/policies/rotation/compat-pr-policy, body: {max_retry_cycles: 3, max_retries_per_cycle: 3}}
    expect: *written
  - id: ldap-role-with-rotation-policy
    depends: [ldap-self-config, ldap-rotation-policy-create]
    request: {method: POST, path: /v1/compat-pr-ldap-self/static-role/with-policy, body: {dn: 'cn=compat-policy,dc=example,dc=invalid', username: compat-policy, password: compat-dummy, rotation_period: 86400, skip_import_rotation: true, disable_automated_rotation: true, rotation_policy: compat-pr-policy}}
    expect: *written
  - id: ldap-role-policy-read
    depends: [ldap-role-with-rotation-policy]
    request: {method: GET, path: /v1/compat-pr-ldap-self/static-role/with-policy}
    expect: {status: 200, exact: {data.rotation_policy: compat-pr-policy}}
  - id: ldap-self-bindpass-mount
    request: {method: POST, path: /v1/sys/mounts/compat-pr-ldap-invalid, body: {type: ldap}}
    expect: *written
  - id: ldap-self-bindpass-exclusive
    # self_managed + bindpass is rejected by both binaries with the same
    # 500 multierror: the server cannot derive a UserBindDN without a
    # bind template, so the bindpass-only self_managed form is refused.
    depends: [ldap-self-bindpass-mount]
    request: {method: POST, path: /v1/compat-pr-ldap-invalid/config, body: {url: 'ldap://127.0.0.1:1', self_managed: true, bindpass: compat-dummy}}
    expect:
      status: [500]
      errors_contain: ["1 error occurred:\\n\\t\\* cannot derive UserBindDN\\n\\n"]
