        verify_connection: false
        allowed_roles: ['*']
        username: compat-root
        password: compat-dummy
        skip_static_role_import_rotation: true
    expect: *written
  - id: database-config-read
    depends: [database-config]
    request: {method: GET, path: /v1/compat-pr-db/config/compat}
    expect: {status: 200, exact: {data.skip_static_role_import_rotation: true}}
  - id: database-skip-missing-password
    # Connection-dependent (fixture-gated on Community): TV validates
    # statically per docs — a skip_import_rotation role without a password
    # (and without self_managed) is rejected 400 before any connection is
    # attempted. Community accepts the write and only fails when it tries
    # to connect to the (unreachable) database to import the password,
    # surfacing a 500 multierror. TV's static validation is the
    # docs-faithful contract; keep the expectation.
    depends: [database-config]
    request: {method: POST, path: /v1/compat-pr-db/static-roles/missing-password, body: {db_name: compat, username: compat, rotation_period: 86400, skip_import_rotation: true}}
    expect: *invalid
  - id: database-static-skip-import
    # Connection-dependent (fixture-gated on Community): TV accepts the
    # role (credentials provided statically). Community accepts the config
    # but fails the role creation with a 500 multierror when it connects
    # to the (unreachable) database to import the existing password — its
    # semantics require a live fixture. Expectation stays TV-faithful.
    depends: [database-config]
    request: {method: POST, path: /v1/compat-pr-db/static-roles/compat, body: {db_name: compat, username: compat, password: compat-dummy, rotation_period: 86400, skip_import_rotation: true}}
    expect: *written
  - id: database-static-read
    depends: [database-static-skip-import]
    request: {method: GET, path: /v1/compat-pr-db/static-roles/compat}
    expect: {status: 200, exact: {data.username: compat, data.rotation_period: 86400}}
  - id: database-static-imported-password
    depends: [database-static-skip-import]
    request: {method: GET, path: /v1/compat-pr-db/static-creds/compat}
    expect: {status: 200, exact: {data.username: compat, data.password: compat-dummy}}
  - id: database-static-exclusive
    depends: [database-config]
    request: {method: POST, path: /v1/compat-pr-db/static-roles/exclusive, body: {db_name: compat, username: compat-invalid, password: compat-dummy, rotation_period: 86400, rotation_schedule: '0 0 * * SAT', skip_import_rotation: true}}
    expect: *invalid
  - id: database-static-short-period
    depends: [database-config]
    request: {method: POST, path: /v1/compat-pr-db/static-roles/short-period, body: {db_name: compat, username: compat-invalid, password: compat-dummy, rotation_period: 4, skip_import_rotation: true}}
    expect: *invalid
  - id: database-rootless-config
    # Vault-managed + self-managed is mutually exclusive: both binaries
    # reject with 400. TV (docs-faithful) surfaces the config conflict:
    # "error creating database object: cannot use both self-managed and
    # vault-managed workflows". Community with this body surfaces its
    # Enterprise static-role gate first ("error creating database object:
    # error initializing static account cache: self-managed static roles
    # only available in Vault Enterprise" — the documented {{password}}
    # template URL takes the static-account-cache path); with a literal
    # non-template URL Community reports the same conflict text as TV.
    # The errors_contain pins the TV/docs text; Community's gate is its
    # enterprise-gap, annotated here.
    depends: [database-mount]
    request: {method: POST, path: /v1/compat-pr-db/config/rootless, body: {<<: *db-config, self_managed: true, username: '', password: ''}}
    expect:
      status: [400]
      errors_contain: ["error creating database object: cannot use both self-managed and vault-managed workflows"]
  - id: database-rootless-role
    # No connection named "rootless" exists: TV answers 500 with the bare
    # text, Community 400 with the multierror-wrapped same text — the
    # status classes differ but the inner text is identical, so the
    # expectation accepts both and asserts the shared text.
    depends: [database-rootless-config]
    request: {method: POST, path: /v1/compat-pr-db/static-roles/rootless, body: {db_name: rootless, username: compat-rootless, password: compat-dummy, rotation_period: 86400, skip_import_rotation: true}}
    expect:
      status: [400, 500]
      errors_contain: ["failed to find entry for connection with name: .rootless."]
  - id: database-rootless-password
    # The role was never created (its creation above is rejected), so the
    # credential read returns 400 "unknown role: rootless" on both
    # binaries.
    depends: [database-rootless-role]
    request: {method: GET, path: /v1/compat-pr-db/static-creds/rootless}
    expect:
      status: [400]
      errors_contain: ["unknown role: rootless"]
  - id: database-rootless-deprecated-password
    # Same missing-connection contract as rootless-role for the legacy
    # self_managed_password field: TV 500 bare / Community 400
    # multierror, identical inner text.
    depends: [database-rootless-config]
    request: {method: POST, path: /v1/compat-pr-db/static-roles/rootless-legacy, body: {db_name: rootless, username: compat-legacy, self_managed_password: compat-dummy, rotation_period: 86400, skip_import_rotation: true}}
    expect:
      status: [400, 500]
      errors_contain: ["failed to find entry for connection with name: .rootless."]
  - id: database-rootless-deprecated-password-read
    # The legacy role was never created; both binaries answer 400
    # "unknown role: rootless-legacy".
    depends: [database-rootless-deprecated-password]
    request: {method: GET, path: /v1/compat-pr-db/static-creds/rootless-legacy}
    expect:
      status: [400]
      errors_contain: ["unknown role: rootless-legacy"]
  - id: database-rootless-username-exclusive
    depends: [database-mount]
    request: {method: POST, path: /v1/compat-pr-db/config/invalid-rootless, body: {<<: *db-config, self_managed: true}}
    expect: *invalid
