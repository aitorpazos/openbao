api: provider-rotation-ldap-and-database-extensions
feature: plugin-rotation-seal
source: https://developer.hashicorp.com/vault/api-docs/auth/ldap
source_version: "v2.x (latest)"
notes: |
  All sources v2.x (latest): primary covers LDAP AUTH rotation_url and root scheduling only.
  Self-managed LDAP, rotation_policy, static-migration and stop are SECRET engine APIs:
  https://developer.hashicorp.com/vault/api-docs/secret/ldap.
  Named rotation-policy fixture: https://developer.hashicorp.com/vault/api-docs/system/policies-rotation.
  compat-pr-policy MUST also be initially absent; it is deleted after the LDAP mount.
  Database: https://developer.hashicorp.com/vault/api-docs/secret/databases and
  https://developer.hashicorp.com/vault/api-docs/secret/databases/postgresql.
  Cloud configuration: https://developer.hashicorp.com/vault/api-docs/auth/aws,
  https://developer.hashicorp.com/vault/api-docs/auth/azure, https://developer.hashicorp.com/vault/api-docs/auth/gcp,
  https://developer.hashicorp.com/vault/api-docs/secret/aws, https://developer.hashicorp.com/vault/api-docs/secret/azure,
  https://developer.hashicorp.com/vault/api-docs/secret/gcp.
  Mount lifecycle: https://developer.hashicorp.com/vault/api-docs/system/auth and
  https://developer.hashicorp.com/vault/api-docs/system/mounts; errors: https://developer.hashicorp.com/vault/api-docs#http-status-codes.
  Disposable admin target. All auth/compat-pr-* and compat-pr-* mounts MUST be initially absent.
  Dummy credentials and closed loopback services; block outbound traffic. No rotate-root or rotate-role.
  Automated cloud/root rotation stays disabled. Static roles have one-day periods and skip import rotation.
  LDAP self-managed config creation has no bindpass; conflicting bindpass is tested on a separate mount.
  Migration checks use an EMPTY mount, not an in-flight real LDAP migration. See notes.md for fixture gates.
  Unknown field rejection is not promised by these docs and is deliberately not asserted. Writes alone
  are not proof of field support; readback checks detect silently ignored configuration fields.
cases:
  - id: ldap-auth-mount
    request: {method: POST, path: /v1/sys/auth/compat-pr-ldap, body: {type: ldap}}
    expect: &written {status: [200, 204]}
  - id: ldap-auth-write
    depends: [ldap-auth-mount]
    request: {method: POST, path: /v1/auth/compat-pr-ldap/config, body: {url: 'ldap://127.0.0.1:1', rotation_url: 'ldap://127.0.0.1:2', binddn: 'cn=compat,dc=example,dc=invalid', bindpass: compat-dummy, rotation_schedule: '0 0 * * SAT', rotation_window: 3600, disable_automated_rotation: true}}
    expect: *written
  - id: ldap-auth-read
    depends: [ldap-auth-write]
    request: {method: GET, path: /v1/auth/compat-pr-ldap/config}
    expect: {status: 200, exact: {data.rotation_url: 'ldap://127.0.0.1:2', data.rotation_schedule: '0 0 * * SAT', data.rotation_window: 3600, data.disable_automated_rotation: true}}
  - id: ldap-auth-exclusive
    depends: [ldap-auth-mount]
    request: {method: POST, path: /v1/auth/compat-pr-ldap/config, body: {url: 'ldap://127.0.0.1:1', rotation_period: 86400, rotation_schedule: '0 0 * * SAT', rotation_window: 0, disable_automated_rotation: true}}
    expect: &invalid
      status: 400
      body_schema: {type: object, required: [errors], properties: {errors: {type: array, items: {type: string}}}}
