# SPDX-License-Identifier: MPL-2.0
api: sys-replication-status
feature: replication
source: https://developer.hashicorp.com/vault/api-docs/system/replication
source_version: "2.x (latest)"
notes: >-
  REP: /sys/replication/status is unauthenticated. Idle streams (both
  binaries): data = {"mode": "disabled"} — the idle body carries a mode
  field (verified live on TelnyxVault and Vault Community). Typed
  endpoints /sys/replication/performance/status and
  /sys/replication/dr/status return the single stream's stanza directly
  under data when a stream is enabled (docs-Enterprise: Community 404s
  them; TelnyxVault implements them); when idle they also serve
  {"mode": "disabled"}. Run first against a disposable target.
cases:
  - id: status-empty-unauth
    request: {method: GET, path: /v1/sys/replication/status}
    no_auth: true
    expect: {status: 200, exact: {data: {mode: disabled}}}
  - id: status-typed-performance-empty
    request: {method: GET, path: /v1/sys/replication/performance/status}
    no_auth: true
    expect: {status: 200, exact: {data: {mode: disabled}}}
  - id: status-typed-dr-empty
    request: {method: GET, path: /v1/sys/replication/dr/status}
    no_auth: true
    expect: {status: 200, exact: {data: {mode: disabled}}}
  - id: status-empty-auth
    request: {method: GET, path: /v1/sys/replication/status}
    expect: {status: 200, exact: {data: {mode: disabled}}}
