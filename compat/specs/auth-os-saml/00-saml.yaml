# SPDX-License-Identifier: MPL-2.0
api: saml-auth-configuration-and-roles
feature: auth-os-saml
source: https://developer.hashicorp.com/vault/api-docs/auth/saml
source_version: "v2.x (latest)"
notes: |
  Source sections: Create or update configuration, Read configuration, role CRUD,
  Obtain SSO service URL, Obtain vault token. Mount lifecycle:
  https://developer.hashicorp.com/vault/api-docs/system/auth (v2.x (latest)).
  Status/errors: https://developer.hashicorp.com/vault/api-docs#http-status-codes
  and #error-response (v2.x (latest)). See notes.md for source discrepancies.
  Disposable licensed Enterprise target, administrative token, root namespace.
  Reserve auth/compat-saml-api/; must be absent initially. No concurrent runs.
  Cleanup unconditionally disables only this mount. Static IdP certificate below
  is a locally generated public test fixture, not a real IdP or response oracle;
  its private key was discarded. Static configuration avoids metadata fetching.
  Browser SSO/callback/token success requires an external IdP fixture and dynamic
  flow state; no successful authentication is claimed. No DELETE config is documented.
  Roles use documented bound_subjects/attributes, NOT allowed_redirect_uris.
  List response example is a bare array; assert status only, not guessed envelope.
cases:
  - id: mount-enable
    request: {method: POST, path: /v1/sys/auth/compat-saml-api, body: {type: saml}}
    expect: {status: [200, 204]}
  - id: config-required-fields
    depends: [mount-enable]
    request: {method: POST, path: /v1/auth/compat-saml-api/config, body: {}}
    expect: &invalid
      status: 400
      body_schema:
        type: object
        required: [errors]
        properties: {errors: {type: array, items: {type: string}}}
  - id: config-create-static
    depends: [mount-enable]
    request:
      method: POST
      path: /v1/auth/compat-saml-api/config
