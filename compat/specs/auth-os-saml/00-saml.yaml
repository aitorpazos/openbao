  - id: config-read
    depends: [config-create-static]
    request: {method: GET, path: /v1/auth/compat-saml-api/config}
    expect:
      status: 200
      exact:
        data.entity_id: https://compat-saml-sp.invalid
        data.acs_urls: [https://compat-saml-sp.invalid/v1/auth/compat-saml-api/callback]
        data.validate_response_signature: true
        data.validate_assertion_signature: true
  - id: config-update
    depends: [config-create-static]
    request:
      method: PUT
      path: /v1/auth/compat-saml-api/config
      body:
        <<: *config
        default_role: compat-saml-role
    expect: {status: [200, 204]}
  - id: config-read-updated
    depends: [config-update]
    request: {method: GET, path: /v1/auth/compat-saml-api/config}
    expect: {status: 200, exact: {data.default_role: compat-saml-role}}
  - id: role-invalid-subject-type
    depends: [mount-enable]
    request:
      method: POST
      path: /v1/auth/compat-saml-api/role/compat-saml-invalid
      body: {bound_subjects: '*@example.invalid', bound_subjects_type: invalid}
    expect: *invalid
  - id: role-create
    depends: [mount-enable]
    request:
      method: POST
      path: /v1/auth/compat-saml-api/role/compat-saml-role
      body: &role
        bound_subjects: '*@example.invalid'
        bound_subjects_type: glob
        bound_attributes: {group: compat-saml-group}
        bound_attributes_type: string
        groups_attribute: group
        token_policies: [compat-saml-policy]
        token_ttl: 300
        token_type: batch
    expect: {status: [200, 204]}
  - id: role-read
    depends: [role-create]
    request: {method: GET, path: /v1/auth/compat-saml-api/role/compat-saml-role}
    expect:
      status: 200
      exact:
        data.bound_subjects: ['*@example.invalid']
        data.bound_subjects_type: glob
        data.bound_attributes.group: [compat-saml-group]
        data.bound_attributes_type: string
        data.groups_attribute: group
        data.token_policies: [compat-saml-policy]
        data.token_ttl: 300
        data.token_type: batch
  - id: role-list
    depends: [role-create]
    request: {method: GET, path: '/v1/auth/compat-saml-api/role?list=true'}
    expect: {status: 200}
  - id: role-update
    depends: [role-create]
    request:
      method: PUT
      path: /v1/auth/compat-saml-api/role/compat-saml-role
      body: {<<: *role, token_ttl: 600, token_policies: [compat-saml-updated]}
    expect: {status: [200, 204]}
  - id: role-read-updated
    depends: [role-update]
    request: {method: GET, path: /v1/auth/compat-saml-api/role/compat-saml-role}
    expect: {status: 200, exact: {data.token_ttl: 600, data.token_policies: [compat-saml-updated]}}
  - id: sso-missing-challenge
    depends: [config-update, role-create]
    request:
      method: POST
      path: /v1/auth/compat-saml-api/sso_service_url
      body: {role: compat-saml-role, client_type: cli, acs_url: 'https://compat-saml-sp.invalid/v1/auth/compat-saml-api/callback'}
    expect: *invalid
  - id: token-missing-required-fields
    depends: [config-update]
    request: {method: POST, path: /v1/auth/compat-saml-api/token, body: {}}
    expect: *invalid
  - id: role-delete
    depends: [role-create]
    request: {method: DELETE, path: /v1/auth/compat-saml-api/role/compat-saml-role}
    expect: {status: [200, 204]}
  - id: mount-cleanup
    request: {method: DELETE, path: /v1/sys/auth/compat-saml-api}
    expect: {status: [200, 204]}
