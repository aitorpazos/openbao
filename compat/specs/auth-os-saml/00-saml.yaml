        acs_urls: [https://compat-saml-sp.invalid/v1/auth/compat-saml-api/callback]
        idp_sso_url: https://compat-saml-idp.invalid/sso
        idp_entity_id: https://compat-saml-idp.invalid
        idp_cert: |
