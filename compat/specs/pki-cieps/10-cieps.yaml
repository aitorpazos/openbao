api: pki-certificate-issuance-external-policy-service
feature: pki-cieps
source: https://developer.hashicorp.com/vault/docs/secrets/pki/cieps
source_version: "v2.x (latest)"
notes: >-
  Wire contract for the Certificate Issuance External Policy Service (CIEPS)
  documented at the URL above (v2.x latest). Config paths and standard
  issuance response fields also draw on
  https://developer.hashicorp.com/vault/api-docs/secret/pki (v2.x latest).
  Mount lifecycle: https://developer.hashicorp.com/vault/api-docs/system/mounts.
  Status/errors: https://developer.hashicorp.com/vault/api-docs#http-status-codes
  and #error-response. All sources v2.x (latest).

  Licensed disposable target, administrative token. compat-pkica-cieps is
  mounted by mount-enable (any pre-existing mount from a prior partial run is
  removed first) and removed by cleanup-unmount. cieps-ca.pem / cieps-leaf.csr
  are the trust anchor and client CSR matching the stand-alone TLS mock service
  (compat/harness/ciepsmock) implementing the documented webhook contract on
  127.0.0.1:8433 (status endpoint on 127.0.0.1:8434). The mock is manual
  provisioning: it is not started or stopped by this suite; notes.md documents
  the mock-mode scenarios (error-only, cert+error warnings, non-JSON body,
  request-UUID mismatch, non-200 status, store+lease, disabled service) that
  require URL reconfiguration between cases and were live-verified.

  Live-verified semantics beyond this suite's wire assertions (openssl on a
  dev server, 2026-10-12): the re-signed certificate verifies against the
  issuing CA (openssl verify OK); its public key equals the CSR's public key
  (sign) or the response private key's public key (issue, rsa and ec); the
  final Issuer DN equals the issuing CA's Subject DN and the AKI is replaced
  by the issuer's SKI per RFC 5280.
cases:
  - id: cleanup-prior-mount
    request: {method: DELETE, path: /v1/sys/mounts/compat-pkica-cieps}
    expect: {status: [204, 400]}
  - id: mount-enable
    depends: [cleanup-prior-mount]
    request: {method: POST, path: /v1/sys/mounts/compat-pkica-cieps, body: {type: pki}}
    expect: {status: [200, 204]}
  - id: cieps-read-default
    depends: [mount-enable]
    request: {method: GET, path: /v1/compat-pkica-cieps/config/external-policy}
    expect:
      status: [200]
      body_schema:
        type: object
        required: [data]
        properties:
          data:
            type: object
            required: [enabled, external_service_url, trusted_ca,
                       external_service_validated, external_service_last_updated,
                       timeout, entity_jmespath, group_jmespath]
            properties:
              enabled: {type: boolean, const: false}
  - id: cieps-reject-insecure-url
    depends: [mount-enable]
    request:
      method: POST
      path: /v1/compat-pkica-cieps/config/external-policy
      body: {external_service_url: "http://insecure.example"}
    expect:
      status: [400]
      errors_contain: ["external_service_url must be an HTTPS URL"]
  - id: cieps-reject-enable-without-trust
    depends: [mount-enable]
    note: >-
      Enabling the service without a trust bundle is rejected: the service
      connection cannot be authenticated without one. With a CA present but
      unparseable, enabling is rejected with "invalid trust certificate
      bundle" (live-verified).
    request:
      method: POST
      path: /v1/compat-pkica-cieps/config/external-policy
      body: {enabled: true, external_service_url: "https://127.0.0.1:8433"}
    expect:
      status: [400]
      errors_contain: ["trusted_ca or trusted_leaf_certificate_bundle is required"]
