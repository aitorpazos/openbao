  - id: cieps-issue-generated-key
    depends: [cieps-root-issuer]
    request:
      method: POST
      path: /v1/compat-pkica-cieps/external-policy/issue
      body: {common_name: issue.cieps.example, key_type: rsa, key_bits: 2048}
    expect:
      status: [200]
      body_schema:
        type: object
        required: [data]
        properties:
          data:
            type: object
            required: [certificate, private_key, private_key_type, issuing_ca, serial_number]
            properties:
              private_key_type: {type: string, const: rsa}
    note: >-
      Live-verified: private_key parses with openssl pkey and its public key
      equals the certificate's; no lease_id is returned when the service does
      not request one.
  - id: cieps-issue-ec
    depends: [cieps-root-issuer]
    request:
      method: POST
      path: /v1/compat-pkica-cieps/external-policy/issue
      body: {common_name: ec.cieps.example, key_type: ec, key_bits: 256}
    expect:
      status: [200]
      body_schema:
        type: object
        required: [data]
        properties:
          data:
            type: object
            required: [certificate, private_key]
            properties:
              private_key_type: {type: string, const: ec}
    note: Live-verified with the same openssl checks as the rsa case.
