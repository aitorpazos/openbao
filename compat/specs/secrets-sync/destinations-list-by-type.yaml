api: secrets_sync_destinations_list_by_type
feature: secrets-sync
source: https://developer.hashicorp.com/vault/api-docs/system/secrets-sync#list-destinations-by-type
source_version: "v2.x (latest)"
notes: >
  Types derive from the five provider creation endpoints on the source page.
  Empty-list 404 contract: https://developer.hashicorp.com/vault/api-docs
  (v2.x (latest)). These empty-list-tolerant cases are not feature gates.
  Harness v1 cannot condition a schema on status, so data is optional but
  constrained when present. No cloud objects or local destinations required.
cases:
  - id: destinations-list-aws
    request: {method: LIST, path: /v1/sys/sync/destinations/aws-sm}
    expect: &list
      status: [200, 404]
      body_schema:
        type: object
        properties:
          data:
            type: object
            required: [keys, total_destinations]
            properties:
              keys: {type: array, items: {type: string}}
              total_destinations: {type: integer}
          errors: {type: array, items: {type: string}}
  - id: destinations-list-azure
    request: {method: LIST, path: /v1/sys/sync/destinations/azure-kv}
    expect: *list
  - id: destinations-list-gcp
    request: {method: LIST, path: /v1/sys/sync/destinations/gcp-sm}
    expect: *list
  - id: destinations-list-gh
    request: {method: LIST, path: /v1/sys/sync/destinations/gh}
    expect: *list
  - id: destinations-list-vercel
    request: {method: LIST, path: /v1/sys/sync/destinations/vercel-project}
    expect: *list
