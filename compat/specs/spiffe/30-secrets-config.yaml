# SPDX-License-Identifier: MPL-2.0
api: spiffe-secrets-configuration
feature: spiffe
source: https://developer.hashicorp.com/vault/api-docs/secret/spiffe
source_version: "v2.x (latest)"
notes: |
  Source sections: Create configuration, Read configuration. Mount lifecycle and
  list/read envelope: https://developer.hashicorp.com/vault/api-docs/system/mounts.
  Type/license: https://developer.hashicorp.com/vault/docs/secrets/spiffe/spiffe.
  Statuses/errors: https://developer.hashicorp.com/vault/api-docs#http-status-codes
  and #error-response. All sources display v2.x (latest).
  Require disposable licensed, initialized and unsealed target and administrative
  root-namespace token. Reserve initially absent compat-spiffe-secrets-config/;
  never reuse a real mount. Cleanup unconditionally disables this mount.
  No external issuer, CA or SPIRE server: engine generates its own signing keys.
  Required-field test precedes valid configuration. Read example has no envelope
  and misspells jwt_oidc_compatibility_mode; do not assert the typo or guess field
  locations/types. Only object/success is asserted for config read. No documented
  DELETE config, configuration LIST or dedicated status endpoint. No error strings.
cases:
  - id: mount-enable
    request:
      method: POST
      path: /v1/sys/mounts/compat-spiffe-secrets-config
      body: {type: spiffe}
    expect: {status: [200, 204]}
  - id: mount-read
    depends: [mount-enable]
    request: {method: GET, path: /v1/sys/mounts/compat-spiffe-secrets-config}
    expect: {status: 200, exact: {data.type: spiffe}}
  - id: mount-list
    depends: [mount-enable]
    request: {method: GET, path: /v1/sys/mounts}
    expect: {status: 200, exact: {data.compat-spiffe-secrets-config/.type: spiffe}}
  - id: missing-trust-domain
    depends: [mount-enable]
    request:
      method: POST
      path: /v1/compat-spiffe-secrets-config/config
      body: {jwt_signing_algorithm: RS256}
    expect: &invalid
      status: 400
      body_schema:
        type: object
        required: [errors]
        properties:
          errors: {type: array, items: {type: string}}
  - id: unsupported-signing-algorithm
    depends: [mount-enable]
    request:
      method: POST
      path: /v1/compat-spiffe-secrets-config/config
      body: {trust_domain: example.org, jwt_signing_algorithm: not-an-algorithm}
    expect: *invalid
  - id: excessive-refresh-hint
    depends: [mount-enable]
    request:
      method: POST
      path: /v1/compat-spiffe-secrets-config/config
      body: {trust_domain: example.org, key_lifetime: 1h, bundle_refresh_hint: 1h}
    expect: *invalid
  - id: configure
    depends: [mount-enable]
    request:
      method: POST
      path: /v1/compat-spiffe-secrets-config/config
      body: {trust_domain: example.org, key_lifetime: 12h, bundle_refresh_hint: 30m, jwt_signing_algorithm: RS256}
    expect: {status: [200, 204]}
  - id: read-configuration
    depends: [mount-enable, configure]
    request: {method: GET, path: /v1/compat-spiffe-secrets-config/config}
    expect: {status: 200, body_schema: {type: object}}
  - id: update-configuration
    depends: [mount-enable, configure]
    request:
      method: POST
      path: /v1/compat-spiffe-secrets-config/config
      body: {trust_domain: example.org, key_lifetime: 24h, bundle_refresh_hint: 1h, jwt_signing_algorithm: RS256, jwt_oidc_compatibility_mode: true}
    expect: {status: [200, 204]}
  - id: read-updated-configuration
    depends: [mount-enable, configure, update-configuration]
    request: {method: GET, path: /v1/compat-spiffe-secrets-config/config}
    expect: {status: 200, body_schema: {type: object}}
  - id: mount-cleanup
    request: {method: DELETE, path: /v1/sys/mounts/compat-spiffe-secrets-config}
    expect: {status: [200, 204]}
