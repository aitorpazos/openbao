# SPDX-License-Identifier: MPL-2.0
api: spiffe-secrets-oidc-discovery
feature: spiffe
source: https://developer.hashicorp.com/vault/api-docs/secret/spiffe
source_version: "v2.x (latest)"
notes: |
  Source: Integrate with OIDC. Unauthenticated curl requests, top-level HTTP
  response objects and dev-server setup are explicitly demonstrated by
  https://developer.hashicorp.com/vault/docs/secrets/spiffe/mint-svid.
  Mount lifecycle: https://developer.hashicorp.com/vault/api-docs/system/mounts;
  statuses: https://developer.hashicorp.com/vault/api-docs#http-status-codes.
  All sources display v2.x (latest). Require licensed disposable unsealed target,
  root-namespace administrative token. Reserve initially absent
  compat-spiffe-discovery/; unconditional cleanup disables only this mount.
  No SPIRE server, external CA or relying party needed. Do not set jwt_issuer_url
  to an unreachable dummy: let Vault use its configured API address. No fixed
  issuer host/port, key ID, modulus, key count or rotation-time assertions.
  API reference shows only RS256 in discovery while walkthrough shows six
  algorithms: assert RS256 membership, not equality with either example array.
  JWKS is checked structurally, not cryptographically. No undocumented public
  trust_bundle/web HTTP method or schema is inferred from its mention in the guide.
cases:
  - id: mount-enable
    request:
      method: POST
      path: /v1/sys/mounts/compat-spiffe-discovery
      body: {type: spiffe}
    expect: {status: [200, 204]}
  - id: configure
    depends: [mount-enable]
    request:
      method: POST
      path: /v1/compat-spiffe-discovery/config
      body: {trust_domain: example.org, jwt_signing_algorithm: RS256, jwt_oidc_compatibility_mode: true}
    expect: {status: [200, 204]}
  - id: public-oidc-discovery
    depends: [mount-enable, configure]
    no_auth: true
    request: {method: GET, path: /v1/compat-spiffe-discovery/.well-known/openid-configuration}
    expect:
      status: 200
      body_schema:
        type: object
        required: [issuer, jwks_uri, response_types_supported, subject_types_supported, id_token_signing_alg_values_supported]
        properties:
          issuer: {type: string}
          jwks_uri: {type: string}
          response_types_supported: {type: array, items: {type: string}}
          subject_types_supported: {type: array, items: {type: string}}
          id_token_signing_alg_values_supported: {type: array, items: {type: string}}
      contains:
        response_types_supported: [id_token]
        subject_types_supported: [public]
        id_token_signing_alg_values_supported: [RS256]
  - id: public-jwks
    depends: [mount-enable, configure]
    no_auth: true
    request: {method: GET, path: /v1/compat-spiffe-discovery/.well-known/keys}
    expect:
      status: 200
      body_schema:
        type: object
        required: [keys]
        properties:
          keys:
            type: array
            items:
              type: object
              required: [use, kty, kid, alg, n, e]
              properties:
                use: {type: string}
                kty: {type: string}
                kid: {type: string}
                alg: {type: string}
                n: {type: string}
                e: {type: string}
  - id: mount-cleanup
    request: {method: DELETE, path: /v1/sys/mounts/compat-spiffe-discovery}
    expect: {status: [200, 204]}
