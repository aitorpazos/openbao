# SPDX-License-Identifier: MPL-2.0
api: spiffe-secrets-roles-and-minting
feature: spiffe
source: https://developer.hashicorp.com/vault/api-docs/secret/spiffe
source_version: "v2.x (latest)"
notes: |
  Source: Create/Read/Delete/List role and Mint JWT token. Valid JSON template
  syntax: https://developer.hashicorp.com/vault/docs/secrets/spiffe/spiffe.
  Root-token dev-server mint and HTTP data.token extraction:
  https://developer.hashicorp.com/vault/docs/secrets/spiffe/mint-svid.
  Mount lifecycle: https://developer.hashicorp.com/vault/api-docs/system/mounts.
  Statuses/errors: https://developer.hashicorp.com/vault/api-docs#http-status-codes
  and #error-response. All sources display v2.x (latest).
  Require disposable licensed unsealed target with administrative root-namespace
  token. Reserve initially absent compat-spiffe-secrets-roles/ and roles
  compat-role, compat-invalid. No external SPIRE/CA/entity fixture needed.
  Negative templates test documented required template/sub constraints, not
  undocumented parser wording. Mint uses an explicit audience because the setup
  guide calls it required while the API lists an empty-string default.
  Role/list examples omit HTTP envelopes; assert success/object only. Mint's
  data.token location is explicit in the walkthrough. JWT decoding/signature,
  expiry and claims are outside this harness; a returned string is not proof of
  a valid JWT-SVID. Do not assert generated key IDs, tokens or times.
  Role deletion and final mount cleanup are unconditional; final unmount also
  removes accidentally accepted invalid roles and generated signing keys.
cases:
  - id: mount-enable
    request:
      method: POST
      path: /v1/sys/mounts/compat-spiffe-secrets-roles
      body: {type: spiffe}
    expect: {status: [200, 204]}
  - id: configure
    depends: [mount-enable]
    request:
      method: POST
      path: /v1/compat-spiffe-secrets-roles/config
      body: {trust_domain: example.org}
    expect: {status: [200, 204]}
  - id: missing-template
    depends: [mount-enable, configure]
    request:
      method: POST
      path: /v1/compat-spiffe-secrets-roles/role/compat-invalid
      body: {}
    expect: &invalid
      status: 400
      body_schema:
        type: object
        required: [errors]
        properties:
          errors: {type: array, items: {type: string}}
  - id: template-missing-sub
    depends: [mount-enable, configure]
    request:
      method: POST
      path: /v1/compat-spiffe-secrets-roles/role/compat-invalid
      body: {template: '{}'}
    expect: *invalid
  - id: role-create
    depends: [mount-enable, configure]
    request:
      method: POST
      path: /v1/compat-spiffe-secrets-roles/role/compat-role
      body: {template: '{"sub":"/compat-workload"}', ttl: 5m, use_jti_claim: false}
    expect: {status: [200, 204]}
  - id: role-read
    depends: [mount-enable, configure, role-create]
    request: {method: GET, path: /v1/compat-spiffe-secrets-roles/role/compat-role}
    expect: {status: 200, body_schema: {type: object}}
  - id: role-list
    depends: [mount-enable, configure, role-create]
    request: {method: LIST, path: /v1/compat-spiffe-secrets-roles/role}
    expect: {status: 200, body_schema: {type: object}}
  - id: mint-path-subject
    depends: [mount-enable, configure, role-create]
    request:
      method: POST
      path: /v1/compat-spiffe-secrets-roles/role/compat-role/mintjwt
      body: {audience: compat-relying-party}
    expect: &mint
      status: 200
      body_schema:
        type: object
        required: [data]
        properties:
          data:
            type: object
            required: [token]
            properties:
              token: {type: string}
  - id: role-update
    depends: [mount-enable, configure, role-create]
    request:
      method: POST
      path: /v1/compat-spiffe-secrets-roles/role/compat-role
      body: {template: '{"sub":"spiffe://example.org/compat-updated"}', ttl: 10m, use_jti_claim: true}
    expect: {status: [200, 204]}
  - id: role-read-updated
    depends: [mount-enable, configure, role-create, role-update]
    request: {method: GET, path: /v1/compat-spiffe-secrets-roles/role/compat-role}
    expect: {status: 200, body_schema: {type: object}}
  - id: mint-full-spiffe-subject
    depends: [mount-enable, configure, role-create, role-update]
    request:
      method: POST
      path: /v1/compat-spiffe-secrets-roles/role/compat-role/mintjwt
      body: {audience: compat-relying-party}
    expect: *mint
  - id: role-delete
    request: {method: DELETE, path: /v1/compat-spiffe-secrets-roles/role/compat-role}
    expect: {status: [200, 204]}
  - id: role-read-deleted
    depends: [mount-enable, configure, role-create, role-delete]
    request: {method: GET, path: /v1/compat-spiffe-secrets-roles/role/compat-role}
    expect:
      status: 404
      body_schema:
        type: object
        required: [errors]
        properties:
          errors: {type: array, items: {type: string}}
  - id: mount-cleanup
    request: {method: DELETE, path: /v1/sys/mounts/compat-spiffe-secrets-roles}
    expect: {status: [200, 204]}
