# SPDX-License-Identifier: MPL-2.0
api: sys-policies-password-entropy-source
feature: entropy-augmentation
source: https://developer.hashicorp.com/vault/api-docs/system/policies-password
source_version: v2.x (latest)
notes: >-
  Source sections: Add/Update password policy (the entropy_source parameter),
  Read password policy, Generate password from password policy. The docs
  define entropy_source ("", platform, seal — seal is the enterprise entropy
  augmentation) as a create/update parameter; the read sample predates the
  parameter and shows only {"policy": ...}. On the fork, seal is rejected at
  create time with 400 because entropy augmentation (an HSM-backed seal) is
  not available — an explicit refusal rather than a silent platform
  degradation. Generation itself always uses the platform source on the
  fork (the only honerable source).
cases:
  - id: create-default-source
    request:
      method: POST
      path: /v1/sys/policies/password/pw-ent
      body: {policy: "length = 20\nrule \"charset\" {\n  charset = \"abcde\"\n}"}
    expect:
      status: [204]
  - id: read-default-omits-source
    request:
      method: GET
      path: /v1/sys/policies/password/pw-ent
    expect:
      status: [200]
      body_schema:
        type: object
        required: [data]
        properties:
          data:
            type: object
            required: [policy]
            properties:
              policy: {type: string}
              entropy_source: {type: string}
  - id: create-platform-source
    request:
      method: POST
      path: /v1/sys/policies/password/pw-ent
      body:
        policy: "length = 20\nrule \"charset\" {\n  charset = \"abcde\"\n}"
        entropy_source: platform
    expect:
      status: [204]
  - id: read-platform-source
    request:
      method: GET
      path: /v1/sys/policies/password/pw-ent
    expect:
      status: [200]
      body_schema:
        type: object
        required: [data]
        properties:
          data:
            type: object
            required: [policy, entropy_source]
            properties:
              policy: {type: string}
              entropy_source: {type: string}
      exact: {data.entropy_source: platform}
  - id: create-seal-source-rejected
    request:
      method: POST
      path: /v1/sys/policies/password/pw-ent-seal
      body:
        policy: "length = 20\nrule \"charset\" {\n  charset = \"abcde\"\n}"
        entropy_source: seal
    expect:
      status: [400]
      errors_contain: ["entropy augmentation"]
  - id: create-invalid-source-rejected
    request:
      method: POST
      path: /v1/sys/policies/password/pw-ent
      body:
        policy: "length = 20\nrule \"charset\" {\n  charset = \"abcde\"\n}"
        entropy_source: bogus
    expect:
      status: [400]
      errors_contain: ["invalid entropy_source"]
  - id: generate-uses-policy
    request:
      method: GET
      path: /v1/sys/policies/password/pw-ent/generate
    expect:
      status: [200]
      body_schema:
        type: object
        required: [data]
        properties:
          data:
            type: object
            required: [password]
            properties:
              password: {type: string}
  - id: cleanup-policy
    request:
      method: DELETE
      path: /v1/sys/policies/password/pw-ent
    expect:
      status: [204]
