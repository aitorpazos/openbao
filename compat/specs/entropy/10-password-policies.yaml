# SPDX-License-Identifier: MPL-2.0
api: sys-policies-password-entropy-source
feature: entropy-augmentation
source: https://developer.hashicorp.com/vault/api-docs/system/policies-password
source_version: v2.x (latest)
notes: >-
  Sources: the api-docs/system/policies-password create/update sample (the
  `policy` parameter is an HCL string; the docs sample ends with a trailing
  newline) and the entropy_source parameter ("", platform, seal — seal is
  the enterprise entropy augmentation). Both TelnyxVault and Vault Community
  accept and persist all three entropy_source values (binary non-enforcement
  of the docs' Enterprise gate: seal is accepted and read back verbatim);
  only an INVALID source name is rejected (400 multierror "unsupported
  entropy source bogus" — identical on both binaries). Generation always
  uses the platform source without an HSM-backed seal (no warning is
  asserted: the docs do not promise one).
cases:
  - id: create-default-source
    request:
      method: POST
      path: /v1/sys/policies/password/pw-ent
      body: {policy: "length = 20\nrule \"charset\" {\n  charset = \"abcde\"\n}\n"}
    expect:
      status: [204]
  - id: read-default-omits-source
    request:
      method: GET
      path: /v1/sys/policies/password/pw-ent
    expect:
      status: [200]
      body_schema:
        type: object
        required: [data]
        properties:
          data:
            type: object
            required: [policy]
            properties:
              policy: {type: string}
              entropy_source: {type: string}
  - id: create-platform-source
    request:
      method: POST
      path: /v1/sys/policies/password/pw-ent
      body:
        policy: "length = 20\nrule \"charset\" {\n  charset = \"abcde\"\n}\n"
        entropy_source: platform
    expect:
      status: [204]
  - id: read-platform-source
    request:
      method: GET
      path: /v1/sys/policies/password/pw-ent
    expect:
      status: [200]
      body_schema:
        type: object
        required: [data]
        properties:
          data:
            type: object
            required: [policy, entropy_source]
            properties:
              policy: {type: string}
              entropy_source: {type: string}
      exact: {data.entropy_source: platform}
  # Docs: seal is the Enterprise entropy augmentation; neither binary
  # enforces the gate — both accept (204) and store the value (read back
  # verbatim). Pinned to the observed 204 on both sides.
  - id: create-seal-source-rejected
    request:
      method: POST
      path: /v1/sys/policies/password/pw-ent-seal
      body:
        policy: "length = 20\nrule \"charset\" {\n  charset = \"abcde\"\n}\n"
        entropy_source: seal
    expect:
      status: [204]
  - id: create-invalid-source-rejected
    request:
      method: POST
      path: /v1/sys/policies/password/pw-ent
      body:
        policy: "length = 20\nrule \"charset\" {\n  charset = \"abcde\"\n}\n"
        entropy_source: bogus
    expect:
      status: [400]
      errors_contain: ["1 error occurred:\\n\\t\\* unsupported entropy source bogus\\n\\n"]
  - id: generate-uses-policy
    request:
      method: GET
      path: /v1/sys/policies/password/pw-ent/generate
    expect:
      status: [200]
      body_schema:
        type: object
        required: [data]
        properties:
          data:
            type: object
            required: [password]
            properties:
              password: {type: string}
  - id: cleanup-policy
    request:
      method: DELETE
      path: /v1/sys/policies/password/pw-ent
    expect:
      status: [204]
