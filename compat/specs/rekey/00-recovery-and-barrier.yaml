# SPDX-License-Identifier: MPL-2.0
api: sys-rekey-and-rekey-recovery-key
feature: rekey-recovery-key
source: https://developer.hashicorp.com/vault/api-docs/system/rekey-recovery-key
source_version: v2.x (latest)
notes: >-
  Sources: api-docs/system/rekey-recovery-key (rekey-recovery-key/init
  read/start/cancel, update, verification, backup) and
  api-docs/system/rekey (the barrier-key rekey ceremony this recovery flow
  mirrors). The docs state recovery endpoints are "only applicable to seals
  that support recovery keys"; on the dev seal (Shamir,
  RecoveryKeySupported()==false) the recovery endpoints return 400
  "recovery rekeying not supported" — the honest documented gating. The
  update endpoint validates the key format before the seal check (mirroring
  the fork's http handler), so a malformed key reports the format error even
  on recovery paths. Barrier-key rekey is exercised through
  init/read/cancel and invalid-parameter contracts (a complete ceremony
  requires the current barrier key, which the harness does not hold).
  Read/init responses are TOP-LEVEL (no data wrapper):
  {"nonce":"",...,"started":false,"t":0,"n":0,"progress":0,"required":1,...}
  — identical on TelnyxVault and Vault Community. Invalid configurations
  surface as coded errors: shares=0 → 500 "invalid rekey seal
  configuration: shares must be at least one"; threshold>shares → 400
  "provided threshold greater than the total shares" (identical on both
  binaries). Cancel requires the in-progress operation's nonce: with a
  rekey in progress, DELETE without the nonce (or with a wrong nonce)
  returns 400 "1 error occurred:\n\t* failed to cancel rekey: invalid
  request\n\n" on both binaries (one shared text — the docs' dedicated
  nonce-mismatch strings are not emitted by either). More precisely, the
  docs' successful 204-cancel is unreachable within a one-shot suite run:
  a rekey started seconds earlier refuses ALL cancels on both binaries
  (TV enforces a ~30s recency window after which its cancel succeeds
  nonce-insensitively; Community refuses cancels of this rekey shape
  outright). The system backend observes DELETE parameters only as query
  values, so the nonce travels in the query string (the documented API
  accepts it in the body too, which the http-package mux handler honors).
  Cancel with nothing in progress is an idempotent 204.
cases:
  - id: recovery-init-read-unavailable
    request:
      method: GET
      path: /v1/sys/rekey-recovery-key/init
    expect:
      status: [400]
      errors_contain: ["recovery rekeying not supported"]
  - id: recovery-init-post-unavailable
    request:
      method: POST
      path: /v1/sys/rekey-recovery-key/init
      body: {secret_shares: 1, secret_threshold: 1}
    expect:
      status: [400]
      errors_contain: ["recovery rekeying not supported"]
  - id: recovery-init-delete-unavailable
    request:
      method: DELETE
      path: /v1/sys/rekey-recovery-key/init
    expect:
      status: [400]
      errors_contain: ["recovery rekeying not supported"]
  - id: recovery-verify-read-unavailable
    request:
      method: GET
      path: /v1/sys/rekey-recovery-key/verify
    expect:
      status: [400]
      errors_contain: ["recovery rekeying not supported"]
  - id: recovery-verify-delete-unavailable
    request:
      method: DELETE
      path: /v1/sys/rekey-recovery-key/verify
    expect:
      status: [400]
      errors_contain: ["recovery rekeying not supported"]
  - id: recovery-update-bad-key
    request:
      method: PUT
      path: /v1/sys/rekey-recovery-key/update
      body: {key: zzz}
    expect:
      status: [400]
      errors_contain: ["'key' must be a valid hex or base64 string"]
  - id: barrier-init-reset-read
    # Rerun tolerance: an interrupted earlier run may have left a rekey in
    # progress; capture its nonce (empty when idle) so the reset below can
    # cancel even a recent attempt. Top-level shape (no data wrapper).
    # pgp_fingerprints is null on both binaries: this suite never supplies
    # pgp_keys, so the field is pinned as null.
    request:
      method: GET
      path: /v1/sys/rekey/init
    expect:
      status: [200]
      body_schema:
        type: object
        required: [started, t, n, progress, required]
        properties:
          started: {type: boolean}
          t: {type: integer}
          n: {type: integer}
          progress: {type: integer}
          required: {type: integer}
          pgp_fingerprints: {type: "null"}
          backup: {type: boolean}
          verification_required: {type: boolean}
    capture:
      reset_nonce: nonce
  - id: barrier-init-cancel-reset
    request:
      method: DELETE
      path: /v1/sys/rekey/init?nonce=$reset_nonce
    expect:
      status: [204]
  - id: barrier-init-read-clean
    request:
      method: GET
      path: /v1/sys/rekey/init
    expect:
      status: [200]
      exact: {started: false}
  - id: barrier-init-post
    request:
      method: POST
      path: /v1/sys/rekey/init
      body: {secret_shares: 1, secret_threshold: 1}
    expect:
      status: [200]
      body_schema:
        type: object
        required: [started, nonce, t, n, progress]
        properties:
          started: {type: boolean}
          nonce: {type: string}
          t: {type: integer}
          n: {type: integer}
      exact: {started: true, n: 1, t: 1, progress: 0}
    capture:
      nonce: nonce
  - id: barrier-init-in-progress
    request:
      method: POST
      path: /v1/sys/rekey/init
      body: {secret_shares: 3, secret_threshold: 2}
    expect:
      status: [400]
      errors_contain: ["rekey already in progress"]
  - id: barrier-init-read-in-progress
    request:
      method: GET
      path: /v1/sys/rekey/init
    expect:
      status: [200]
      exact: {started: true, progress: 0}
  - id: barrier-verify-read-no-verification
    # A started (non-verification) rekey exposes a verification status of
    # started:false with an empty nonce. Top-level shape (no data wrapper).
    request:
      method: GET
      path: /v1/sys/rekey/verify
    expect:
      status: [200]
      body_schema:
        type: object
        required: [started, nonce, t, n, progress]
        properties:
          started: {type: boolean}
          nonce: {type: string}
      exact: {started: false, nonce: ""}
  - id: barrier-update-bad-key
    request:
      method: PUT
      path: /v1/sys/rekey/update
      body: {key: zzz}
    expect:
      status: [400]
      errors_contain: ["'key' must be a valid hex or base64 string"]
  # Both binaries answer a nonceless (or mismatched-nonce) cancel of an
  # in-progress rekey with the same 500-class multierror text; the docs'
  # dedicated nonce-mismatch strings are not emitted by either side.
  - id: barrier-init-cancel-recent-requires-nonce
    request:
      method: DELETE
      path: /v1/sys/rekey/init
    expect:
      status: [400]
      errors_contain: ["1 error occurred:\\n\\t\\* failed to cancel rekey: invalid request\\n\\n"]
  - id: barrier-init-cancel-wrong-nonce
    request:
      method: DELETE
      path: /v1/sys/rekey/init?nonce=00000000-0000-0000-0000-000000000000
    expect:
      status: [400]
      errors_contain: ["1 error occurred:\\n\\t\\* failed to cancel rekey: invalid request\\n\\n"]
  - id: barrier-init-cancel
    # The docs' 204-cancel of an in-progress rekey is unreachable inside a
    # one-shot suite run: a rekey started seconds earlier refuses ALL
    # cancels on both binaries with the same 400 multierror (nonce
    # irrelevant). TV additionally implements a >30s recency window after
    # which the cancel succeeds (204, nonce-insensitive) — the oracle
    # refuses cancels of this rekey shape outright — but that path is not
    # exercised within the suite's single-pass window. Pinned to the
    # observed refusal (identical on both sides).
    request:
      method: DELETE
      path: /v1/sys/rekey/init?nonce=$nonce
    expect:
      status: [400]
      errors_contain: ["1 error occurred:\\n\\t\\* failed to cancel rekey: invalid request\\n\\n"]
  - id: barrier-init-read-after-cancel
    # The cancel above is refused (recent-start refusal, identical on both
    # binaries), so the rekey remains in progress.
    request:
      method: GET
      path: /v1/sys/rekey/init
    expect:
      status: [200]
      exact: {started: true}
  - id: barrier-init-zero-shares
    request:
      method: POST
      path: /v1/sys/rekey/init
      body: {secret_shares: 0, secret_threshold: 0}
    expect:
      status: [500]
      errors_contain: ["invalid rekey seal configuration: shares must be at least one"]
  - id: barrier-init-threshold-over-shares
    request:
      method: POST
      path: /v1/sys/rekey/init
      body: {secret_shares: 1, secret_threshold: 2}
    expect:
      status: [400]
      errors_contain: ["provided threshold greater than the total shares"]
  - id: backup-read-empty
    request:
      method: GET
      path: /v1/sys/rekey/recovery-key-backup
    expect:
      status: [400]
      errors_contain: ["no backed-up keys found"]
